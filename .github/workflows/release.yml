name: Release

# Push a tag like v0.2.0 to build agent-grove-0.2.0.vsix and publish it as a GitHub Release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Merge first, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Stamp the tag version into the extension
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm --prefix extension version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm run package:ext

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "agent-grove-$VERSION.vsix" \
            --title "Agent Grove $VERSION" \
            --generate-notes \
            --notes "Install: \`code --install-extension agent-grove-$VERSION.vsix\`, then run **Agent Grove: Install Agent Hooks**."
