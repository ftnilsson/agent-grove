<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-jungle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🌴 git-jungle</h1>
  <form id="open-form">
    <input id="repo-input" list="recents" placeholder="Path to a git repository or worktree" spellcheck="false">
    <datalist id="recents"></datalist>
    <button>Open</button>
  </form>
  <span class="spacer"></span>
  <button id="refresh" title="Refresh (auto every 5s)">↻</button>
  <button id="prune" title="git worktree prune">Prune</button>
  <button id="add" class="primary">＋ New worktree</button>
</header>
<div id="toast" hidden></div>
<main>
  <section>
    <h2 id="repo-title">No repository open</h2>
    <div id="graph"></div>
    <div id="cards"></div>
  </section>
</main>

<dialog id="add-dialog">
  <form method="dialog" id="add-form">
    <h3>New worktree</h3>
    <label class="radio"><input type="radio" name="mode" value="new" checked> New branch</label>
    <label class="radio"><input type="radio" name="mode" value="existing"> Existing branch</label>
    <label>Branch <input name="branch" list="branch-list" required spellcheck="false" autocomplete="off"></label>
    <datalist id="branch-list"></datalist>
    <label id="base-row">Start from <input name="base" list="branch-list" spellcheck="false" autocomplete="off"></label>
    <label>Path <input name="path" required spellcheck="false"></label>
    <div class="actions">
      <button type="button" data-close>Cancel</button>
      <button class="primary">Create</button>
    </div>
  </form>
</dialog>

<dialog id="confirm-dialog">
  <form method="dialog" id="confirm-form">
    <h3 id="confirm-title"></h3>
    <p id="confirm-body"></p>
    <label id="confirm-opt" class="radio" hidden><input type="checkbox" id="confirm-opt-box"> <span></span></label>
    <div class="actions">
      <button type="button" data-close>Cancel</button>
      <button class="danger" id="confirm-ok">Confirm</button>
    </div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
